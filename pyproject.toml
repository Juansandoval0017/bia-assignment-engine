[project]
name = "bia-assignment-engine"
version = "0.1.0"
description = "Motor de asignacion comercial para la prueba tecnica de Bia"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]
snowflake = [
    "snowflake-connector-python>=3.12,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
